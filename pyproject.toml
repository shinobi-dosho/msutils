[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msutils"
version = "3.0.0"
description = "Everyday Measurement Set operations for radio-astronomy pipelines."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Sphesihle Makhathini", email = "sphemakh@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# The base install covers everything that runs on casacore + TaQL: msinfo,
# the column operations, subsetting, flag versions, flag statistics and the
# diagnostics. Only genuinely heavier stacks are optional, below.
dependencies = [
    "numpy",
    "python-casacore",
    "click>=8.0",
]

[project.scripts]
msutils = "msutils.cli:cli"

[project.optional-dependencies]
# PNG summary plots for flagstats.
plots = [
    "matplotlib",
]
# msutils.average: time/channel averaging via codex-africanus.
average = [
    "codex-africanus>=0.4",
]
# Reading MSv4 processing sets. Plain xarray+zarr is enough -- xradio is
# only needed to *write* one (the `convert` extra below).
msv4 = [
    "xarray>=2025.0",
    "zarr",
]
# Reading an MSv2 through the MSv4 schema, without converting it.
xarray-ms = [
    "xarray-ms>=0.5",
]
# msutils.convert: writing MSv2 -> MSv4 processing sets.
convert = [
    "xradio[casacore]>=1.2",
]
all = [
    "msutils[plots,average,msv4,xarray-ms,convert]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# The behavioural tests build their own Measurement Sets with python-casacore
# (see tests/msfactory.py), so the suite needs no simulator. The optional
# stacks are included so the averaging and MSv4 tests actually run rather
# than skipping.
test = [
    "pytest>=8.0",
    "matplotlib",
    "codex-africanus>=0.4",
    "xradio[casacore]>=1.2",
    "xarray-ms>=0.5",
]

[project.urls]
Homepage = "https://github.com/SpheMakh/msutils"
Repository = "https://github.com/SpheMakh/msutils"
Issues = "https://github.com/SpheMakh/msutils/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/msutils"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/msutils",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so test modules can import the msfactory helper.
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 180

[tool.ruff.lint]
# Mirror the pre-refactor flake8 hard-fail gate: syntax errors and
# undefined names only. `# noqa: F821` markers in the source are load-bearing.
select = ["E9", "F63", "F7", "F82"]
