[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msutils"
version = "3.0.0"
description = "Everyday Measurement Set operations for radio-astronomy pipelines."
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
authors = [
    { name = "Sphesihle Makhathini", email = "sphemakh@gmail.com" },
    { name = "Athanaseus Ramaila", email = "armaila@sarao.ac.za" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# The base install covers everything that runs on casacore + TaQL: msinfo,
# the column operations, subsetting, flag versions, flag statistics and the
# diagnostics. Only genuinely heavier stacks are optional, below.
dependencies = [
    "numpy",
    "python-casacore",
    "click>=8.0",
]

[project.scripts]
msutils = "msutils.cli:cli"
gainutils = "msutils.gains.cli:cli"

[project.optional-dependencies]
# PNG summary plots for flagstats.
plots = [
    "matplotlib",
]
# msutils.average: time/channel averaging via codex-africanus.
average = [
    "codex-africanus>=0.4",
]
# msutils.gains: reading QuartiCal gain stores. Exactly what `msv4` needs
# (plain xarray + zarr) and named separately because the reason differs -- a
# gain store is not a processing set, and a caller wanting one should not have
# to know the other exists. CASA caltables need nothing beyond the base
# install, so a bootstrap between two of them works without this extra.
gains = [
    "msutils[msv4]",
]
# Reading MSv4 processing sets. Plain xarray+zarr is enough -- xradio is
# only needed to *write* one (the `convert` extra below).
msv4 = [
    "xarray>=2025.0",
    "zarr",
]
# Reading an MSv2 through the MSv4 schema, without converting it.
xarray-ms = [
    "xarray-ms>=0.5",
]
# msutils.convert: writing MSv2 -> MSv4 processing sets.
#
# `ipython` is not ours: xradio pulls in `toolviper`, whose
# `toolviper/utils/display.py` imports IPython unconditionally while its own
# metadata does not require it. Converting therefore dies with
# `ModuleNotFoundError: No module named 'IPython'` on an otherwise complete
# install. Declared here so `msutils[convert]` actually converts; drop it when
# toolviper declares its own dependency.
convert = [
    "xradio[casacore]>=1.2",
    "ipython",
]
all = [
    "msutils[plots,average,gains,msv4,xarray-ms,convert]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Documentation build (Sphinx + Furo + autodoc). `uv sync --group docs`.
# Keep in sync with docs/requirements.txt, which Read the Docs installs.
docs = [
    "sphinx>=7.2",
    "furo>=2024.1",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]
# The behavioural tests build their own Measurement Sets with python-casacore
# (see tests/msfactory.py), so the suite needs no simulator. The optional
# stacks are included so the averaging and MSv4 tests actually run rather
# than skipping.
test = [
    "pytest>=8.0",
    "matplotlib",
    "codex-africanus>=0.4",
    "xradio[casacore]>=1.2",
    "xarray-ms>=0.5",
]

[project.urls]
Homepage = "https://msutils.readthedocs.io"
Repository = "https://github.com/shinobi-dosho/msutils"
Issues = "https://github.com/shinobi-dosho/msutils/issues"
Documentation = "https://msutils.readthedocs.io"
Changelog = "https://github.com/shinobi-dosho/msutils/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/msutils"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/msutils",
    "/README.md",
    "/LICENSE",
    "/AGENTS.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so test modules can import the msfactory helper.
pythonpath = ["src", "tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# `select`, not `extend-select` and not the implicit default. This list is the
# repo's *whole* ruleset, stated outright rather than inherited from whatever
# ruff happens to enable this month -- a ruff upgrade that widens its defaults
# then shows up in the PR that bumps the lock, where it can be read, instead of
# in whichever PR happens to follow.
#
# 2.x ran a four-rule gate (E9/F63/F7/F82) inherited from the old flake8 setup,
# which caught syntax errors and undefined names and nothing else. The families
# below are the ones whose findings on this tree were worth fixing, and they
# are fixed -- nothing here is aspirational.
select = [
    "F",     # pyflakes -- real errors: undefined names, unused imports
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "B",     # bugbear -- mutable defaults, blind excepts, ...
    "C4",    # comprehension rewrites
    "DTZ",   # naive datetimes -- MS times are UTC, and it matters here
    "EXE",   # shebang/executable-bit mismatches
    "FA",    # missing `from __future__ import annotations`
    "FURB",  # modernizations
    "G",     # logging call format (no f-strings in logger.* -- lazy % args)
    "I",     # import sorting
    "ICN",   # conventional import aliases
    "ISC",   # implicit string concatenation
    "LOG",   # logging misuse
    "PGH",   # blanket `# noqa` / `# type: ignore` without a code
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "Q",     # quote style
    "RSE",   # `raise X()` not `raise X`
    "RUF",   # ruff's own rules, incl. unused `# noqa`
    "SIM",   # simplifications
    "T10",   # stray debugger imports
    "T20",   # stray `print` -- this is a library; CLI output goes through click
    "TID",   # relative-import hygiene
    "UP",    # pyupgrade -- the floor is 3.11, so PEP 585/604 apply
    "YTT",   # sys.version misuse
]
ignore = [
    # The formatter owns line length. E501 would only ever fire on lines
    # `ruff format` has already declared final (long string literals it cannot
    # split), which is a permanent floor, not a signal.
    "E501",
]

# Deliberately NOT selected: PLR/PLC (magic numbers, argument counts -- a
# project-wide policy choice, not a cleanup), ERA (prose in comments that reads
# as code), and ANN/D/S (annotations, docstring style, bandit -- same reason).

[tool.ruff.lint.per-file-ignores]
# The synthetic-MS factory and the tests around it read better with numpy's
# `np` alias than with the `numpy` the library uses.
"tests/**" = ["ICN001"]

[tool.ruff.format]
docstring-code-format = true
